<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作物倒计时管理系统</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --border: #e2e6ea;
            --text: #1a1d23;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --primary: #4f6ef7;
            --primary-hover: #3b54db;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning-light: #fef3c7;
            --danger-light: #fee2e2;
            --crop-16h-bg: #3b82f6;
            --crop-16h-text: #ffffff;
            --crop-16h-border: #2563eb;
            --crop-32h-bg: #ef4444;
            --crop-32h-text: #ffffff;
            --crop-32h-border: #dc2626;
            --blessed-color: #f59e0b;
            --blessed-bg: #fffbeb;
            --unblessed-color: #9ca3af;
            --unblessed-bg: #f9fafb;
            --yesterday-bless-yes: #10b981;
            --yesterday-bless-yes-bg: #ecfdf5;
            --yesterday-bless-no: #ef4444;
            --yesterday-bless-no-bg: #fef2f2;
            --yesterday-bless-na: #9ca3af;
            --yesterday-bless-na-bg: #f9fafb;
            --group-border-color: #94a3b8;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
        .app-container { max-width: 1800px; margin:0 auto; padding:20px 24px 40px; }
        .app-header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; padding:20px 24px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); }
        .header-actions { display:flex; gap:8px; align-items:center; }
        .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:var(--radius-sm); font-size:0.875rem; font-weight:500; cursor:pointer; border:1px solid transparent; transition:all var(--transition); white-space:nowrap; font-family:var(--font); outline:none; background:var(--surface); color:var(--text); border-color:var(--border); }
        .btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .btn-primary:hover { background:var(--primary-hover); }
        .btn-outline:hover { background:#f9fafb; }
        .btn-success { background:var(--success); color:#fff; border-color:var(--success); }
        .btn-success:hover { background:#059669; }
        .btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
        .btn-danger:hover { background:var(--danger-hover); }
        .btn-info { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }
        .btn-info:hover { background:#0284c7; border-color:#0284c7; }
        .btn-sm { padding:6px 11px; font-size:0.8rem; }
        .btn-xs { padding:2px 6px; font-size:0.65rem; }
        .btn:disabled { opacity:0.45; cursor:not-allowed; }
        .tooltip-wrapper { position:relative; display:inline-flex; }
        .tooltip-text { visibility:hidden; opacity:0; position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:6px 12px; border-radius:6px; font-size:0.75rem; white-space:nowrap; pointer-events:none; transition:opacity 0.2s; z-index:100; }
        .tooltip-wrapper:hover .tooltip-text { visibility:visible; opacity:1; }
        .table-wrapper { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; margin-bottom: 16px; }
        .table-scroll { overflow-x:auto; max-height:85vh; overflow-y:auto; }
        table { width:100%; border-collapse:collapse; min-width:1600px; font-size:0.875rem; }
        thead th { background:#f8fafc; padding:10px 14px; text-align:left; font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-secondary); border-bottom:2px solid #e5e7eb; white-space:nowrap; user-select:none; }
        thead th.sortable { cursor:pointer; position:relative; padding-right:28px; }
        thead th.sortable:hover { color:var(--primary); }
        .sort-icon { position:absolute; right:8px; font-size:0.7rem; opacity:0.5; }
        .sort-active .sort-icon { opacity:1; color:var(--primary); }
        .reset-sort { position:absolute; right:24px; font-size:0.65rem; cursor:pointer; opacity:0; transition:opacity 0.2s; color:var(--text-muted); }
        .sort-active .reset-sort { opacity:0.7; }
        .reset-sort:hover { opacity:1; color:var(--danger); }
        tbody td { padding:10px 14px; border-bottom:1px solid #f1f3f4; vertical-align:middle; }
        tbody tr.row-warning { background:var(--warning-light); }
        tbody tr.row-success { background:var(--success-light); }
        tbody tr.row-editing { background:#f0f4ff; box-shadow:inset 3px 0 0 var(--primary); }
        tbody.group-tbody { border: 2px dashed var(--group-border-color); }
        tbody.group-tbody tr:last-child td { border-bottom: none; }
        tbody.spacer-tbody td { padding: 1px 14px; border-bottom: none; background: transparent; }
        .crop-badge { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:20px; font-size:0.8rem; font-weight:700; white-space:nowrap; }
        .crop-badge.crop-16h { background: var(--crop-16h-bg); color: var(--crop-16h-text); border: 2px solid var(--crop-16h-border); }
        .crop-badge.crop-32h { background: var(--crop-32h-bg); color: var(--crop-32h-text); border: 2px solid var(--crop-32h-border); }
        .mature-cell { display:flex; flex-direction:column; gap:4px; }
        .mature-time { font-weight:700; font-family:'SF Mono', 'Consolas', monospace; white-space:nowrap; }
        .mature-ripe-badge { display:inline-block; background:#ef4444; color:white; font-size:0.7rem; padding:2px 6px; border-radius:4px; margin-left:6px; font-weight:600; }
        .water-reduction-hint { display:block; font-size:0.7rem; color:#ef4444; animation: hintFadeIn 0.3s ease, hintFadeOut 0.6s ease 2.4s forwards; margin-top:2px; }
        @keyframes hintFadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; } }
        @keyframes hintFadeOut { to { opacity:0; } }
        .mature-progress { display:flex; align-items:center; gap:6px; }
        .boss-hp-stack { flex:1; min-width:80px; height:8px; background:#e5e7eb; border-radius:10px; overflow:hidden; position:relative; }
        .boss-hp-layer { position:absolute; left:0; top:0; bottom:0; transition:width 0.5s ease; }
        .layer-label { font-size:0.7rem; font-weight:600; color:var(--text-secondary); white-space:nowrap; min-width:20px; text-align:center; }
        .water-vertical { display:flex; flex-direction:column; gap:4px; min-width:140px; }
        .progress-bar-wrap { height:8px; background:#e5e7eb; border-radius:10px; overflow:hidden; }
        .progress-bar-fill { height:100%; border-radius:10px; transition:width 0.5s ease; }
        .progress-bar-fill.green { background:#10b981; }
        .progress-bar-fill.orange { background:#f59e0b; }
        .progress-bar-fill.red { background:#ef4444; }
        .dry-badge-large { display:inline-flex; align-items:center; gap:4px; background:#dc2626; color:#ffffff; font-size:0.85rem; font-weight:700; padding:5px 12px; border-radius:20px; margin-left:4px; }
        .water-low-icon { display:inline-block; color:#3b82f6; font-size:0.9rem; margin-left:4px; animation: dropletPulse 1.5s ease-in-out infinite; }
        @keyframes dropletPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.2); opacity:0.7; } }
        .water-reduction-inline { font-size:0.7rem; color: var(--text-muted); white-space:nowrap; }
        .water-reduction-inline b { color: var(--text); }
        .yesterday-bless-badge { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:20px; font-size:0.78rem; font-weight:600; cursor:default; transition:all var(--transition); user-select:none; white-space:nowrap; }
        .yesterday-bless-badge.yes { background: var(--yesterday-bless-yes-bg); color: var(--yesterday-bless-yes); border: 2px solid var(--yesterday-bless-yes); }
        .yesterday-bless-badge.no { background: var(--yesterday-bless-no-bg); color: var(--yesterday-bless-no); border: 2px solid var(--yesterday-bless-no); }
        .yesterday-bless-badge.na { background: var(--yesterday-bless-na-bg); color: var(--yesterday-bless-na); border: 2px solid #d1d5db; }
        .remark-cell { min-width:100px; }
        .remark-text { font-size:0.8rem; color:var(--text); cursor:pointer; min-height:20px; padding:4px 6px; border-radius:4px; transition:all var(--transition); }
        .remark-text:hover { background:#f3f4f6; }
        .remark-input { width:100%; font-size:0.8rem; padding:4px 6px; border:1.5px solid var(--primary); border-radius:4px; font-family:var(--font); outline:none; }
        .edit-input { width:90px; padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; font-family:'SF Mono','Consolas',monospace; text-align:center; }
        .edit-input:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 3px rgba(79,110,247,0.1); }
        .edit-user-input { width:110px; padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; }
        .edit-select { padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; background:white; cursor:pointer; }
        .toast-container { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
        .toast { background:#1e293b; color:#fff; padding:12px 18px; border-radius:var(--radius-sm); font-size:0.875rem; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toastSlideIn 0.35s ease; max-width:400px; }
        .toast-undo { background:#fff; color:#1e293b; border:none; padding:5px 12px; border-radius:4px; cursor:pointer; font-weight:600; font-size:0.8rem; }
        .toast-close { background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1rem; }
        @keyframes toastSlideIn { from { transform:translateX(60px); opacity:0; } to { transform:translateX(0); opacity:1; } }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:8000; display:flex; align-items:center; justify-content:center; }
        .modal { background:white; border-radius:var(--radius); padding:24px; box-shadow:var(--shadow-lg); max-width:400px; width:90%; }
        .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
        .immediate-mature-badge { display:inline-block; background:#dc2626; color:#ffffff; font-size:0.75rem; font-weight:700; padding:3px 8px; border-radius:4px; white-space:nowrap; float:right; }
        .approx-mature { color:#f59e0b; }
        .rank-badge { display:inline-block; font-size:0.7rem; font-weight:700; padding:2px 7px; border-radius:10px; margin-left:6px; white-space:nowrap; color:#ffffff; float:right; }
        .rank-badge.r1 { background:#dc2626; }
        .rank-badge.r2 { background:#f59e0b; }
        .rank-badge.r3 { background:#3b82f6; }
        .water-wait-cell { text-align:left; }
        .water-wait-cell .wait-time-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .water-wait-cell .time-block {
            display: inline-block;
            min-width: 100px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1em;
            color: #dc2626;
            background: #fef2f2;
            padding: 0 6px;
            border-radius: 3px;
            font-family: var(--font);
        }
        .water-wait-cell .suffix-text {
            white-space: nowrap;
            color: var(--text-secondary);
        }
        .water-wait-cell .predict-block {
            display: inline-block;
            min-width: 48px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1em;
            color: #2563eb;
            background: #eff6ff;
            padding: 0 4px;
            border-radius: 3px;
            font-family: var(--font);
        }
        .water-wait-cell .predict-label {
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .log-modal { max-width:700px; max-height:80vh; width:95%; }
        .log-table-wrap { max-height:50vh; overflow-y:auto; margin-top:12px; border:1px solid var(--border); border-radius:var(--radius-sm); }
        .log-table { width:100%; border-collapse:collapse; font-size:0.8rem; min-width:600px; }
        .log-table th { background:#f8fafc; padding:10px 12px; text-align:left; font-weight:600; font-size:0.75rem; color:var(--text-secondary); border-bottom:1px solid #e5e7eb; position:sticky; top:0; z-index:1; }
        .log-table td { padding:8px 12px; border-bottom:1px solid #f1f3f4; vertical-align:top; white-space:pre-wrap; font-size:0.78rem; max-width:200px; word-break:break-all; }
        .log-empty { text-align:center; padding:32px 16px; color:var(--text-muted); }
        .config-panel { position: fixed; bottom: 20px; right: 20px; z-index: 7000; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border); width: 340px; transition: all 0.3s ease; }
        .config-panel.collapsed .config-body { display: none; }
        .config-panel.collapsed { width: auto; }
        .config-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--text); }
        .config-body { padding: 0 16px 16px; }
        .config-body textarea { width: 100%; height: 120px; font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.8rem; padding: 8px; border: 1.5px solid #d1d5db; border-radius: var(--radius-sm); resize: vertical; }
        .config-body textarea:focus { outline: none; border-color: var(--primary); }
        .config-body .btn { margin-top: 8px; width: 100%; justify-content: center; }
        .config-toggle { font-size: 1rem; transition: transform 0.3s; }
        .config-panel.collapsed .config-toggle { transform: rotate(180deg); }
        .checkin-wrapper { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
        .checkin-table { min-width: auto !important; font-size: 0.8rem; }
        .checkin-table thead th { padding: 8px 14px; font-size: 0.75rem; text-align: center; white-space: nowrap; background: #f0f4f8; }
        .checkin-table tbody td { padding: 8px 14px; text-align: center; vertical-align: middle; }
        .checkin-table .type-label { font-weight: 700; font-size: 0.8rem; color: var(--text); white-space: nowrap; }
        .checkin-tag-wrapper { position: relative; display: inline-block; margin: 2px 3px; vertical-align: middle; }
        .checkin-tag { display: inline-flex; align-items:center; justify-content:center; padding: 3px 8px; height: 24px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all var(--transition); user-select: none; white-space: nowrap; background: #e5e7eb; color: #6b7280; border: 1.5px solid #d1d5db; position: relative; }
        .checkin-tag.checked-bless { background: #10b981; color: #ffffff; border-color: #059669; }
        .checkin-tag.checked-task { background: #3b82f6; color: #ffffff; border-color: #2563eb; }
        .checkin-tag:hover { transform: scale(1.02); box-shadow: var(--shadow-sm); }
        .tag-extra-label { position: absolute; top: -8px; right: -8px; background: #f97316; color: #ffffff; font-size: 0.5rem; font-weight: 700; padding: 1px 4px; border-radius: 10px; line-height: 1; z-index: 2; white-space: nowrap; pointer-events: none; }
        .tag-extra-label.achieved { background: #3b82f6; }
        .tag-hover-options { display: none; position: absolute; bottom: 100%; left: 0; z-index: 10; background: #ffffff; border: 1px solid #d1d5db; border-radius: 6px; box-shadow: var(--shadow-lg); padding: 4px; white-space: nowrap; margin-bottom: 4px; }
        .tag-hover-options.show { display: flex; gap: 4px; }
        .task-type-cell { display:inline-flex; align-items:center; gap:2px; margin:2px; padding:4px; border:1px solid #e2e6ea; border-radius:4px; background:#f9fafb; transition: background 0.2s; }
        .task-type-cell.has-both { background: #a3e635; }
        .task-type-input { width:40px; padding:2px 4px; border:1px solid #d1d5db; border-radius:3px; font-size:0.7rem; text-align:center; }
        .task-type-input:focus { border-color: var(--primary); outline:none; }
        .task-type-input.achieved { border-color: #3b82f6; background: #eff6ff; }
        .task-type-select { padding:2px; border:1px solid #d1d5db; border-radius:3px; font-size:0.65rem; }
        .btn-copy { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
        .btn-copy:hover { background: #7c3aed; border-color: #7c3aed; }
        @media (max-width:768px) { .app-container { padding:10px 8px; } table { min-width:1300px; } .log-modal { max-width:95vw; } .config-panel { width: 90vw; right: 5vw; } .checkin-table { min-width: auto !important; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1>🌾 作物倒计时管理系统</h1>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" id="btnExport">📥 导出</button>
            <button class="btn btn-outline btn-sm" id="btnImport">📤 导入</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none;">
            <button class="btn btn-primary" id="btnAddRow">＋ 添加行</button>
        </div>
    </div>
    <div class="table-wrapper">
        <div class="table-scroll" id="tableScroll">
            <table id="mainTable">
                <thead><tr>
                    <th style="width:50px;">Id</th>
                    <th>用户</th><th>作物类型</th>
                    <th class="sortable" id="thMature">成熟倒计时<span class="sort-icon">↕</span><span class="reset-sort" id="resetSort">↺</span></th>
                    <th>浇水湿润倒计时</th><th>浇水成熟剩余时间</th><th>连续祝福</th><th>备注</th><th>操作</th>
                </tr></thead>
            </table>
        </div>
        <div id="emptyState" style="display:none; padding:48px; text-align:center; color:var(--text-muted);">📋<p>暂无数据</p></div>
    </div>

    <div class="checkin-wrapper" style="margin-top:16px;">
        <div style="overflow-x:auto;">
            <table class="checkin-table" id="checkinTable">
                <thead><tr>
                    <th style="width:80px;">类型 \\ 名称</th>
                    <th>主</th><th>豆子鱼</th><th>seven</th><th>大猪</th><th>微信</th>
                    <th>玥</th>
                    <th style="width:60px;">操作</th>
                </tr></thead>
                <tbody>
                <tr id="checkinBlessRow">
                    <td class="type-label">🙏 祝福</td>
                </tr>
                <tr id="checkinTaskRow">
                    <td class="type-label">📋 任务</td>
                </tr>
                <tr id="checkinTaskTypeRow">
                    <td class="type-label">📝 任务类型</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="config-panel collapsed" id="configPanel">
    <div class="config-header" id="configHeader">
        <span>⚙️ 分组配置</span>
        <span class="config-toggle">▼</span>
    </div>
    <div class="config-body">
        <textarea id="configTextarea" placeholder="格式：&#10;1, 2&#10;3, 4, 5&#10;表示 id1、id2 为一组，id3、id4、id5 为一组"></textarea>
        <button class="btn btn-primary btn-sm" id="btnApplyConfig">✅ 应用配置</button>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div id="modalContainer"></div>

<script>
    (function() {
        const CROP_CONFIG = {
            '16h': { matureTotal:57600, waterMax:19200, waterThreshold:18000, label:'16h作物', cssClass:'crop-16h' },
            '32h': { matureTotal:115200, waterMax:38400, waterThreshold:36000, label:'32h作物', cssClass:'crop-32h' }
        };
        const LAYER_COLORS = ['#3b82f6', '#f59e0b', '#ef4444', '#10b981', '#8b5cf6'];
        const STORAGE_KEY = 'crop-management-data';
        const CHECKIN_STORAGE_KEY = 'crop-checkin-data';
        const TASK_TYPE_STORAGE_KEY = 'crop-task-type-data';
        const CONFIG_STORAGE_KEY = 'crop-management-config';
        const LOG_STORAGE_KEY = 'crop-management-logs';
        const SORT_DEFAULT = 'default';
        const SORT_MATURE_ASC = 'matureAsc';
        const UNDO_TIMEOUT = 5000, WATER_HINT_DURATION = 3000;
        const BLESS_RESET_HOUR = 0;
        const BLESS_RESET_MINUTE = 30;
        const LOG_RETENTION_DAYS = 3;
        const WATER_LOW_THRESHOLD = 7200;
        const COL_COUNT = 9;

        const CHECKIN_USERS = ['主', '豆子鱼', 'seven', '大猪', '微信', '玥'];
        const CHECKIN_BLESS_TAGS = {
            '主': [116, 393, 545],
            '豆子鱼': [542, 543, 544],
            'seven': [522, 543, 544, 545, 546],
            '大猪': [543, 544, 545, 546],
            '微信': [119],
            '玥': [97]
        };
        const CHECKIN_TASK_TAGS = {
            '主': [116, 393, 545],
            '豆子鱼': [542, 543, 544],
            'seven': [522, 543, 544, 545, 546],
            '大猪': [543, 544, 545, 546],
            '微信': [119],

        btnApplyConfig.addEventListener('click',()=>{saveGroupConfig();renderGroupedTable();showToast('✅ 分组配置已应用');});
        setInterval(()=>{const now=Date.now(),elapsed=Math.floor((now-tickBaseTime)/1000);if(elapsed<=0)return;tickBaseTime+=elapsed*1000;let changed=false;rows.forEach(r=>{if(editingRowId===r.id)return;if(r.matureCountdown>0){r.matureCountdown=Math.max(0,r.matureCountdown-elapsed);changed=true;}if(r.waterCountdown>0){r.waterCountdown=Math.max(0,r.waterCountdown-elapsed);changed=true;}});if(changed){updateDynamicDisplay();saveToStorage();}if(Math.floor(Date.now()/60000)!==Math.floor((Date.now()-1000)/60000)){renderGroupedTable();}if(Math.floor(Date.now()/30000)!==Math.floor((Date.now()-1000)/30000))checkAndResetDaily();},1000);
        function updateDynamicDisplay(){document.querySelectorAll('tbody tr[data-id]').forEach(tr=>{const id=Number(tr.getAttribute('data-id')),row=rows.find(r=>r.id===id);if(!row||editingRowId===id)return;const c=CROP_CONFIG[row.cropType];const matureCell=document.getElementById(`mature-cell-${id}`);if(matureCell&&!matureCell.querySelector('input')){const ts=matureCell.querySelector('.mature-time');if(ts)ts.innerHTML=formatTime(row.matureCountdown)+(row.matureCountdown<=0?' <span class="mature-ripe-badge">熟</span>':'');const op=matureCell.querySelector('.mature-progress');if(op)op.remove();if(row.matureCountdown<=0){const eb=document.createElement('div');eb.className='mature-progress';const s=document.createElement('div');s.className='boss-hp-stack';eb.appendChild(s);matureCell.appendChild(eb);}else matureCell.appendChild(renderBossHpBar(row.matureCountdown));}const waterDiv=tr.querySelector('.water-vertical');if(waterDiv){const span=waterDiv.querySelector('span');if(span){const waterLow=row.waterCountdown>0&&row.waterCountdown<=WATER_LOW_THRESHOLD;const isDry=row.waterCountdown<=0;const waterIcon=waterLow&&!isDry?' <span class="water-low-icon" title="湿润时间不足2小时">💧</span>':'';const dryBadge=isDry?' <span class="dry-badge-large">干枯</span>':'';const reduction=calcWaterReduction(row);const reductionHtml=reduction>0?` <span class="water-reduction-inline">(${formatReductionBold(reduction)})</span>`:'';const timeDisplay=isDry?'':formatTime(row.waterCountdown);span.innerHTML=timeDisplay+dryBadge+waterIcon+reductionHtml;}const percent=c.waterMax?Math.min(100,(row.waterCountdown/c.waterMax)*100):0;const fill=waterDiv.querySelector('.progress-bar-fill');if(fill){fill.style.width=percent+'%';fill.className='progress-bar-fill '+(percent>50?'green':percent>=20?'orange':'red');}}const waterBtn=tr.querySelector('.water-btn');if(waterBtn){const st=canWater(row);waterBtn.disabled=!st.can;const wr=waterBtn.closest('.tooltip-wrapper');if(wr){let tip=wr.querySelector('.tooltip-text');if(!st.can){if(!tip){tip=document.createElement('span');tip.className='tooltip-text';wr.appendChild(tip);}tip.textContent=st.reason;}else if(tip)tip.remove();}}tr.className=row.matureCountdown<=0?'row-success':(row.matureCountdown<=3600?'row-warning':'');});}
        loadLogs();cleanOldLogs();loadGroupConfig();loadCheckinData();loadTaskTypeData();
        if(!loadFromStorage()){rows=[];nextId=1;nextCreateOrder=1;lastBlessResetDate='';saveToStorage();}
        checkAndResetDaily();renderGroupedTable();renderCheckinTable();renderTaskTypeRow();
        window.addEventListener('beforeunload',saveToStorage);
        document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const now=Date.now(),elapsed=Math.floor((now-tickBaseTime)/1000);if(elapsed>1){rows.forEach(r=>{if(editingRowId===r.id)return;r.matureCountdown=Math.max(0,r.matureCountdown-elapsed);r.waterCountdown=Math.max(0,r.waterCountdown-elapsed);});tickBaseTime=now;saveToStorage();renderGroupedTable();checkAndResetDaily();}}else{saveToStorage();}});
    })();
</script>
</body>
