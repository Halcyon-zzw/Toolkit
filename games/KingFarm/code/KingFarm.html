<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作物倒计时管理系统</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --border: #e2e6ea;
            --text: #1a1d23;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --primary: #4f6ef7;
            --primary-hover: #3b54db;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning-light: #fef3c7;
            --danger-light: #fee2e2;
            --crop-16h-bg: #3b82f6;
            --crop-16h-text: #ffffff;
            --crop-16h-border: #2563eb;
            --crop-32h-bg: #ef4444;
            --crop-32h-text: #ffffff;
            --crop-32h-border: #dc2626;
            --blessed-color: #f59e0b;
            --blessed-bg: #fffbeb;
            --unblessed-color: #9ca3af;
            --unblessed-bg: #f9fafb;
            --yesterday-bless-yes: #10b981;
            --yesterday-bless-yes-bg: #ecfdf5;
            --yesterday-bless-no: #ef4444;
            --yesterday-bless-no-bg: #fef2f2;
            --yesterday-bless-na: #9ca3af;
            --yesterday-bless-na-bg: #f9fafb;
            --group-border-color: #94a3b8;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        .app-container { max-width: 1800px; margin:0 auto; padding:20px 24px 40px; }
        .app-header {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
            gap:12px; margin-bottom:24px; padding:20px 24px;
            background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
            border:1px solid var(--border);
        }
        .header-actions { display:flex; gap:8px; align-items:center; }
        .btn {
            display:inline-flex; align-items:center; gap:6px; padding:9px 16px;
            border-radius:var(--radius-sm); font-size:0.875rem; font-weight:500;
            cursor:pointer; border:1px solid transparent; transition:all var(--transition);
            white-space:nowrap; font-family:var(--font); outline:none;
            background:var(--surface); color:var(--text); border-color:var(--border);
        }
        .btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .btn-primary:hover { background:var(--primary-hover); }
        .btn-outline:hover { background:#f9fafb; }
        .btn-success { background:var(--success); color:#fff; border-color:var(--success); }
        .btn-success:hover { background:#059669; }
        .btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
        .btn-danger:hover { background:var(--danger-hover); }
        .btn-info { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }
        .btn-info:hover { background:#0284c7; border-color:#0284c7; }
        .btn-sm { padding:6px 11px; font-size:0.8rem; }
        .btn:disabled { opacity:0.45; cursor:not-allowed; }
        .tooltip-wrapper { position:relative; display:inline-flex; }
        .tooltip-text {
            visibility:hidden; opacity:0; position:absolute; bottom:calc(100% + 8px);
            left:50%; transform:translateX(-50%); background:#1e293b; color:#fff;
            padding:6px 12px; border-radius:6px; font-size:0.75rem; white-space:nowrap;
            pointer-events:none; transition:opacity 0.2s; z-index:100;
        }
        .tooltip-wrapper:hover .tooltip-text { visibility:visible; opacity:1; }
        .table-wrapper {
            background:var(--surface); border-radius:var(--radius);
            box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden;
        }
        .table-scroll { overflow-x:auto; max-height:75vh; overflow-y:auto; }
        table { width:100%; border-collapse:collapse; min-width:1800px; font-size:0.875rem; }
        thead th {
            background:#f8fafc; padding:13px 14px; text-align:left; font-weight:600;
            font-size:0.8rem; text-transform:uppercase; letter-spacing:0.04em;
            color:var(--text-secondary); border-bottom:2px solid #e5e7eb;
            white-space:nowrap; user-select:none;
        }
        thead th.sortable { cursor:pointer; position:relative; padding-right:28px; }
        thead th.sortable:hover { color:var(--primary); }
        .sort-icon { position:absolute; right:8px; font-size:0.7rem; opacity:0.5; }
        .sort-active .sort-icon { opacity:1; color:var(--primary); }
        .reset-sort {
            position:absolute; right:24px; font-size:0.65rem; cursor:pointer;
            opacity:0; transition:opacity 0.2s; color:var(--text-muted);
        }
        .sort-active .reset-sort { opacity:0.7; }
        .reset-sort:hover { opacity:1; color:var(--danger); }
        tbody td { padding:12px 14px; border-bottom:1px solid #f1f3f4; vertical-align:middle; }
        tbody tr.row-warning { background:var(--warning-light); }
        tbody tr.row-success { background:var(--success-light); }
        tbody tr.row-editing { background:#f0f4ff; box-shadow:inset 3px 0 0 var(--primary); }

        /* 分组虚线框样式 */
        tbody.group-tbody { border: 2px dashed var(--group-border-color); }
        tbody.group-tbody tr:last-child td { border-bottom: none; }
        tbody.spacer-tbody td { padding: 4px 14px; border-bottom: none; background: transparent; }

        .crop-badge {
            display:inline-flex; align-items:center; gap:4px;
            padding:5px 12px; border-radius:20px; font-size:0.8rem;
            font-weight:700; white-space:nowrap;
        }
        .crop-badge.crop-16h { background: var(--crop-16h-bg); color: var(--crop-16h-text); border: 2px solid var(--crop-16h-border); }
        .crop-badge.crop-32h { background: var(--crop-32h-bg); color: var(--crop-32h-text); border: 2px solid var(--crop-32h-border); }

        .mature-cell { display:flex; flex-direction:column; gap:4px; }
        .mature-time { font-weight:700; font-family:'SF Mono', 'Consolas', monospace; white-space:nowrap; }
        .mature-ripe-badge { display:inline-block; background:#ef4444; color:white; font-size:0.7rem; padding:2px 6px; border-radius:4px; margin-left:6px; font-weight:600; }
        .water-reduction-hint { display:block; font-size:0.7rem; color:#ef4444; animation: hintFadeIn 0.3s ease, hintFadeOut 0.6s ease 2.4s forwards; margin-top:2px; }
        @keyframes hintFadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; } }
        @keyframes hintFadeOut { to { opacity:0; } }

        .mature-progress { display:flex; align-items:center; gap:6px; }
        .boss-hp-stack { flex:1; min-width:80px; height:8px; background:#e5e7eb; border-radius:10px; overflow:hidden; position:relative; }
        .boss-hp-layer { position:absolute; left:0; top:0; bottom:0; transition:width 0.5s ease; }
        .layer-label { font-size:0.7rem; font-weight:600; color:var(--text-secondary); white-space:nowrap; min-width:20px; text-align:center; }

        .water-vertical { display:flex; flex-direction:column; gap:4px; min-width:140px; }
        .progress-bar-wrap { height:8px; background:#e5e7eb; border-radius:10px; overflow:hidden; }
        .progress-bar-fill { height:100%; border-radius:10px; transition:width 0.5s ease; }
        .progress-bar-fill.green { background:#10b981; }
        .progress-bar-fill.orange { background:#f59e0b; }
        .progress-bar-fill.red { background:#ef4444; }
        .dry-badge { display:inline-block; background:#fef2f2; color:#dc2626; font-size:0.68rem; padding:2px 7px; border-radius:10px; margin-left:4px; }
        .water-low-icon { display:inline-block; color:#3b82f6; font-size:0.9rem; margin-left:4px; animation: dropletPulse 1.5s ease-in-out infinite; }
        @keyframes dropletPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.2); opacity:0.7; } }
        .water-reduction-inline { font-size:0.7rem; color: var(--text-muted); white-space:nowrap; }

        .blessed-badge {
            display:inline-flex; align-items:center; gap:4px;
            padding:4px 10px; border-radius:20px; font-size:0.78rem;
            font-weight:600; cursor:pointer; transition:all var(--transition);
            user-select:none; white-space:nowrap;
        }
        .blessed-badge.has-bless { background: var(--blessed-bg); color: var(--blessed-color); border: 1.5px solid var(--blessed-color); }
        .blessed-badge.has-bless:hover { background: #fef3c7; transform: scale(1.03); }
        .blessed-badge.no-bless { background: var(--unblessed-bg); color: var(--unblessed-color); border: 1.5px solid #d1d5db; }
        .blessed-badge.no-bless:hover { background: #f3f4f6; }
        .bless-icon { font-size:0.9rem; }

        .task-badge {
            display:inline-flex; align-items:center; gap:4px;
            padding:5px 12px; border-radius:20px; font-size:0.78rem;
            font-weight:600; cursor:pointer; transition:all var(--transition);
            user-select:none; white-space:nowrap;
        }
        .task-badge.undone { background: #fef2f2; color: #dc2626; border: 2px solid #ef4444; }
        .task-badge.undone:hover { background: #fee2e2; transform: scale(1.04); }
        .task-badge.done { background: #065f46; color: #ffffff; border: 2px solid #047857; }
        .task-badge.done:hover { background: #047857; transform: scale(1.04); }
        .task-icon { font-size:0.9rem; }

        .yesterday-bless-badge {
            display:inline-flex; align-items:center; gap:4px;
            padding:5px 12px; border-radius:20px; font-size:0.78rem;
            font-weight:600; cursor:default; transition:all var(--transition);
            user-select:none; white-space:nowrap;
        }
        .yesterday-bless-badge.yes { background: var(--yesterday-bless-yes-bg); color: var(--yesterday-bless-yes); border: 2px solid var(--yesterday-bless-yes); }
        .yesterday-bless-badge.no { background: var(--yesterday-bless-no-bg); color: var(--yesterday-bless-no); border: 2px solid var(--yesterday-bless-no); }
        .yesterday-bless-badge.na { background: var(--yesterday-bless-na-bg); color: var(--yesterday-bless-na); border: 2px solid #d1d5db; }

        .remark-cell { min-width:100px; }
        .remark-text { font-size:0.8rem; color:var(--text); cursor:pointer; min-height:20px; padding:4px 6px; border-radius:4px; transition:all var(--transition); }
        .remark-text:hover { background:#f3f4f6; }
        .remark-input { width:100%; font-size:0.8rem; padding:4px 6px; border:1.5px solid var(--primary); border-radius:4px; font-family:var(--font); outline:none; }

        .edit-input { width:90px; padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; font-family:'SF Mono','Consolas',monospace; text-align:center; }
        .edit-input:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 3px rgba(79,110,247,0.1); }
        .edit-user-input { width:110px; padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; }
        .edit-select { padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; background:white; cursor:pointer; }
        .toast-container { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
        .toast { background:#1e293b; color:#fff; padding:12px 18px; border-radius:var(--radius-sm); font-size:0.875rem; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toastSlideIn 0.35s ease; max-width:400px; }
        .toast-undo { background:#fff; color:#1e293b; border:none; padding:5px 12px; border-radius:4px; cursor:pointer; font-weight:600; font-size:0.8rem; }
        .toast-close { background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1rem; }
        @keyframes toastSlideIn { from { transform:translateX(60px); opacity:0; } to { transform:translateX(0); opacity:1; } }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:8000; display:flex; align-items:center; justify-content:center; }
        .modal { background:white; border-radius:var(--radius); padding:24px; box-shadow:var(--shadow-lg); max-width:400px; width:90%; }
        .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
        .immediate-mature { color:#10b981; font-weight:600; }
        .approx-mature { color:#f59e0b; }
        .log-modal { max-width:700px; max-height:80vh; width:95%; }
        .log-table-wrap { max-height:50vh; overflow-y:auto; margin-top:12px; border:1px solid var(--border); border-radius:var(--radius-sm); }
        .log-table { width:100%; border-collapse:collapse; font-size:0.8rem; min-width:600px; }
        .log-table th { background:#f8fafc; padding:10px 12px; text-align:left; font-weight:600; font-size:0.75rem; color:var(--text-secondary); border-bottom:1px solid #e5e7eb; position:sticky; top:0; z-index:1; }
        .log-table td { padding:8px 12px; border-bottom:1px solid #f1f3f4; vertical-align:top; white-space:pre-wrap; font-size:0.78rem; max-width:200px; word-break:break-all; }
        .log-empty { text-align:center; padding:32px 16px; color:var(--text-muted); }
        .predicted-time { font-size:0.72rem; color: var(--text-muted); margin-left:4px; white-space:nowrap; }

        .config-panel {
            position: fixed; bottom: 20px; right: 20px; z-index: 7000;
            background: var(--surface); border-radius: var(--radius);
            box-shadow: var(--shadow-lg); border: 1px solid var(--border);
            width: 340px; transition: all 0.3s ease;
        }
        .config-panel.collapsed .config-body { display: none; }
        .config-panel.collapsed { width: auto; }
        .config-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; cursor: pointer; font-weight: 600;
            font-size: 0.85rem; color: var(--text);
        }
        .config-body { padding: 0 16px 16px; }
        .config-body textarea {
            width: 100%; height: 120px; font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 0.8rem; padding: 8px; border: 1.5px solid #d1d5db;
            border-radius: var(--radius-sm); resize: vertical;
        }
        .config-body textarea:focus { outline: none; border-color: var(--primary); }
        .config-body .btn { margin-top: 8px; width: 100%; justify-content: center; }
        .config-toggle { font-size: 1rem; transition: transform 0.3s; }
        .config-panel.collapsed .config-toggle { transform: rotate(180deg); }
        @media (max-width:768px) { .app-container { padding:10px 8px; } table { min-width:1500px; } .log-modal { max-width:95vw; } .config-panel { width: 90vw; right: 5vw; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1>🌾 作物倒计时管理系统</h1>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" id="btnExport">📥 导出</button>
            <button class="btn btn-outline btn-sm" id="btnImport">📤 导入</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none;">
            <button class="btn btn-primary" id="btnAddRow">＋ 添加行</button>
        </div>
    </div>
    <div class="table-wrapper">
        <div class="table-scroll" id="tableScroll">
            <table id="mainTable">
                <thead><tr>
                    <th style="width:50px;">Id</th>
                    <th>用户</th><th>作物类型</th>
                    <th class="sortable" id="thMature">成熟倒计时<span class="sort-icon">↕</span><span class="reset-sort" id="resetSort">↺</span></th>
                    <th>浇水湿润倒计时</th><th>浇水成熟剩余时间</th><th>祝福</th><th>每日任务</th><th>连续祝福</th><th>备注</th><th>操作</th>
                </tr></thead>
            </table>
        </div>
        <div id="emptyState" style="display:none; padding:48px; text-align:center; color:var(--text-muted);">📋<p>暂无数据</p></div>
    </div>
</div>

<div class="config-panel collapsed" id="configPanel">
    <div class="config-header" id="configHeader">
        <span>⚙️ 分组配置</span>
        <span class="config-toggle">▼</span>
    </div>
    <div class="config-body">
        <textarea id="configTextarea" placeholder="格式：&#10;1, 2&#10;3, 4, 5&#10;表示 id1、id2 为一组，id3、id4、id5 为一组"></textarea>
        <button class="btn btn-primary btn-sm" id="btnApplyConfig">✅ 应用配置</button>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div id="modalContainer"></div>

<script>
    (function() {
        const CROP_CONFIG = {
            '16h': { matureTotal:57600, waterMax:19200, waterThreshold:18000, label:'16h作物', cssClass:'crop-16h' },
            '32h': { matureTotal:115200, waterMax:38400, waterThreshold:36000, label:'32h作物', cssClass:'crop-32h' }
        };
        const LAYER_COLORS = ['#3b82f6', '#f59e0b', '#ef4444', '#10b981', '#8b5cf6'];
        const STORAGE_KEY = 'crop-management-data';
        const CONFIG_STORAGE_KEY = 'crop-management-config';
        const LOG_STORAGE_KEY = 'crop-management-logs';
        const SORT_DEFAULT = 'default';
        const SORT_MATURE_ASC = 'matureAsc';
        const UNDO_TIMEOUT = 5000, WATER_HINT_DURATION = 3000;
        const BLESS_RESET_HOUR = 3;
        const LOG_RETENTION_DAYS = 3;
        const WATER_LOW_THRESHOLD = 7200;

        let rows = [], nextId = 1, nextCreateOrder = 1, sortState = SORT_DEFAULT;
        let editingRowId = null, editSnapshot = null, lastSaveTime = Date.now(), undoData = {};
        let lastBlessResetDate = '';
        let tickBaseTime = Date.now();
        let logs = [], nextLogId = 1;
        let groupConfig = '';

        const $ = s => document.querySelector(s);
        const mainTable = $('#mainTable');
        const emptyState = $('#emptyState');
        const toastContainer = $('#toastContainer'), modalContainer = $('#modalContainer');
        const thMature = $('#thMature'), resetSortBtn = $('#resetSort'), tableScroll = $('#tableScroll');
        const configPanel = $('#configPanel'), configHeader = $('#configHeader');
        const configTextarea = $('#configTextarea'), btnApplyConfig = $('#btnApplyConfig');

        function parseGroupConfig(configStr) {
            const groups = [];
            if (!configStr.trim()) return groups;
            const lines = configStr.split('\n');
            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;
                const ids = trimmed.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
                if (ids.length > 0) groups.push(ids);
            });
            return groups;
        }

        function getGroupSortedRows() {
            if (sortState !== SORT_DEFAULT) {
                const sorted = [...rows];
                if (sortState === SORT_MATURE_ASC) sorted.sort((a,b) => a.matureCountdown - b.matureCountdown);
                return { sorted, groups: [] };
            }
            const groups = parseGroupConfig(groupConfig);
            if (groups.length === 0) return { sorted: [...rows].sort((a,b) => a.createOrder - b.createOrder), groups: [] };

            const groupedRows = [];
            const groupedIds = new Set();
            groups.forEach(groupIds => {
                const groupRows = [];
                groupIds.forEach(id => {
                    const row = rows.find(r => r.id === id);
                    if (row) { groupRows.push(row); groupedIds.add(id); }
                });
                if (groupRows.length > 0) groupedRows.push(groupRows);
            });
            const ungrouped = rows.filter(r => !groupedIds.has(r.id)).sort((a,b) => a.createOrder - b.createOrder);
            return { grouped: groupedRows, ungrouped, groups };
        }

        function clearTableBody() {
            // 移除 <thead> 之后的所有元素（即所有 <tbody>）
            while (mainTable.children.length > 1) {
                mainTable.removeChild(mainTable.lastChild);
            }
        }

        function renderGroupedTable() {
            clearTableBody();
            const { grouped, ungrouped, sorted } = getGroupSortedRows();

            if (sortState !== SORT_DEFAULT || (!grouped && groups.length === 0)) {
                const allSorted = sorted || [...rows].sort((a,b) => sortState === SORT_MATURE_ASC ? a.matureCountdown - b.matureCountdown : a.createOrder - b.createOrder);
                if (allSorted.length === 0) { emptyState.style.display='block'; tableScroll.style.display='none'; return; }
                emptyState.style.display='none'; tableScroll.style.display='block';
                const tbody = document.createElement('tbody');
                allSorted.forEach(row => tbody.appendChild(createRowElement(row)));
                mainTable.appendChild(tbody);
                bindAllEvents();
                return;
            }

            const allGrouped = grouped || [];
            const allUngrouped = ungrouped || [];
            const totalRows = allGrouped.reduce((sum, g) => sum + g.length, 0) + allUngrouped.length;
            if (totalRows === 0) { emptyState.style.display='block'; tableScroll.style.display='none'; return; }
            emptyState.style.display='none'; tableScroll.style.display='block';

            // 渲染分组
            allGrouped.forEach((groupRows, groupIndex) => {
                const tbody = document.createElement('tbody');
                tbody.className = 'group-tbody';
                groupRows.forEach(row => tbody.appendChild(createRowElement(row)));
                mainTable.appendChild(tbody);

                // 组间间距
                if (groupIndex < allGrouped.length - 1 || allUngrouped.length > 0) {
                    const spacer = document.createElement('tbody');
                    spacer.className = 'spacer-tbody';
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 11;
                    td.innerHTML = '&nbsp;';
                    tr.appendChild(td);
                    spacer.appendChild(tr);
                    mainTable.appendChild(spacer);
                }
            });

            // 渲染未分组
            if (allUngrouped.length > 0) {
                const tbody = document.createElement('tbody');
                allUngrouped.forEach(row => tbody.appendChild(createRowElement(row)));
                mainTable.appendChild(tbody);
            }
            bindAllEvents();
        }

        function createRowElement(row) {
            const isEdit = editingRowId === row.id;
            const c = CROP_CONFIG[row.cropType];
            const waterPercent = c.waterMax ? Math.min(100, (row.waterCountdown / c.waterMax) * 100) : 0;

        function showWaterHint(rowId, reduction) { const cell = document.getElementById(`mature-cell-${rowId}`); if (!cell) return; const old = document.getElementById(`hint-${rowId}`); if (old) old.remove(); const hint = document.createElement('span'); hint.className='water-reduction-hint'; hint.id=`hint-${rowId}`; hint.textContent = `- ${formatTimeHM(reduction)}`; cell.appendChild(hint); setTimeout(()=>hint.remove(), WATER_HINT_DURATION); }
        function toggleBless(rowId) { const row = rows.find(r=>r.id===rowId); if (!row || editingRowId===rowId) return; const ob = row.blessed; row.blessed = !row.blessed; addLog(row.id,'修改祝福状态',formatBlessState(ob),formatBlessState(row.blessed)); saveToStorage(); updateBlessCell(row); if (!row.blessed) showToast('🙏 祝福已使用，明天凌晨3点恢复'); }
        function toggleDailyTask(rowId) { const row = rows.find(r=>r.id===rowId); if (!row || editingRowId===rowId) return; const ot = row.dailyTaskDone; row.dailyTaskDone = !row.dailyTaskDone; addLog(row.id,'修改每日任务状态',formatTaskState(ot),formatTaskState(row.dailyTaskDone)); saveToStorage(); updateTaskCell(row); if (row.dailyTaskDone) showToast('✅ 每日任务已完成'); }
        function updateBlessCell(row) { const tr = document.querySelector(`tbody tr[data-id="${row.id}"]`); if (!tr) return; const td = tr.children[6]; if (td) { td.innerHTML = renderBlessBadge(row); bindBlessClick(row.id, td); } }
        function updateTaskCell(row) { const tr = document.querySelector(`tbody tr[data-id="${row.id}"]`); if (!tr) return; const td = tr.children[7]; if (td) { td.innerHTML = renderTaskBadge(row); bindTaskClick(row.id, td); } }
        function renderBlessBadge(row) { return row.blessed ? `<span class="blessed-badge has-bless" data-bless-id="${row.id}"><span class="bless-icon">✨</span> 有</span>` : `<span class="blessed-badge no-bless" data-bless-id="${row.id}"><span class="bless-icon">💤</span> 无</span>`; }
        function renderTaskBadge(row) { return row.dailyTaskDone ? `<span class="task-badge done" data-task-id="${row.id}"><span class="task-icon">✅</span> 已完成</span>` : `<span class="task-badge undone" data-task-id="${row.id}"><span class="task-icon">⏳</span> 未完成</span>`; }
        function renderConsecutiveBlessBadge(row) { const val = row.consecutiveBless || '-'; const cls = val === '是' ? 'yes' : (val === '否' ? 'no' : 'na'); const icon = val === '是' ? '✅' : (val === '否' ? '❌' : '➖'); return `<span class="yesterday-bless-badge ${cls}"><span>${icon}</span> ${val}</span>`; }
        function renderCropBadge(row) { const c = CROP_CONFIG[row.cropType]; return `<span class="crop-badge ${c.cssClass}">🌱 ${c.label}</span>`; }
        function bindBlessClick(rowId, td) { const b = td.querySelector('.blessed-badge'); if (b) b.addEventListener('click', () => toggleBless(rowId)); }
        function bindTaskClick(rowId, td) { const b = td.querySelector('.task-badge'); if (b) b.addEventListener('click', () => toggleDailyTask(rowId)); }
        function enterEdit(rowId) { if (editingRowId && editingRowId!==rowId) cancelEdit(); const row = rows.find(r=>r.id===rowId); if (!row) return; editingRowId = rowId; editSnapshot = { mature:row.matureCountdown, water:row.waterCountdown, time:Date.now(), crop:row.cropType, user:row.user, matureDirty:false, waterDirty:false, cropChanged:false, beforeState:formatRowState(row) }; renderGroupedTable(); }
        function cancelEdit() { if (!editingRowId) return; const row = rows.find(r=>r.id===editingRowId); if (row && editSnapshot) { row.matureCountdown=editSnapshot.mature; row.waterCountdown=editSnapshot.water; row.cropType=editSnapshot.crop; row.user=editSnapshot.user; } editingRowId=null; editSnapshot=null; saveToStorage(); renderGroupedTable(); }
        function saveEdit(rowId) { if (editingRowId!==rowId) return; const row = rows.find(r=>r.id===rowId); if (!row) return; const bs = editSnapshot.beforeState; const elapsed = Math.floor((Date.now() - editSnapshot.time)/1000); if (editSnapshot.cropChanged) { const c = CROP_CONFIG[row.cropType]; row.matureCountdown = editSnapshot.matureDirty ? row.matureCountdown : c.matureTotal; row.waterCountdown = editSnapshot.waterDirty ? row.waterCountdown : c.waterMax; } else { if (!editSnapshot.matureDirty) row.matureCountdown = Math.max(0, editSnapshot.mature - elapsed); if (!editSnapshot.waterDirty) row.waterCountdown = Math.max(0, editSnapshot.water - elapsed); } addLog(row.id,'修改',bs,formatRowState(row)); editingRowId=null; editSnapshot=null; saveToStorage(); renderGroupedTable(); }
        function saveRemark(rowId, newValue) { const row = rows.find(r=>r.id===rowId); if (!row) return; const oldRemark = row.remark; row.remark = newValue; addLog(row.id, '修改备注', `备注：${oldRemark || '(空)'}`, `备注：${newValue || '(空)'}`); saveToStorage(); }
        function parseTimeInput(val) { const d = val.replace(/\D/g,'').slice(0,4); if (d.length<4) return null; return parseInt(d.substring(0,2),10)*3600 + Math.min(59, parseInt(d.substring(2,4),10))*60; }
        function updateSortUI() { if (sortState === SORT_MATURE_ASC) { thMature.classList.add('sort-active'); thMature.querySelector('.sort-icon').textContent = '↑'; } else { thMature.classList.remove('sort-active'); thMature.querySelector('.sort-icon').textContent = '↕'; } }
        function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
        thMature.onclick = e => { if (e.target === resetSortBtn || resetSortBtn.contains(e.target)) return; sortState = sortState === SORT_DEFAULT ? SORT_MATURE_ASC : SORT_DEFAULT; renderGroupedTable(); };
        resetSortBtn.onclick = e => { e.stopPropagation(); sortState = SORT_DEFAULT; renderGroupedTable(); };
        document.getElementById('btnAddRow').onclick = ()=>{ if (editingRowId) cancelEdit(); const row=addRow(); renderGroupedTable(); enterEdit(row.id); };
        document.getElementById('btnExport').onclick = ()=>{ const data={exportTime:Date.now(),rows:rows.map(r=>({...r})),nextId,nextCreateOrder}; const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`crop-data-${new Date().toISOString().slice(0,10)}.json`; a.click(); showToast('已导出'); };
        document.getElementById('btnImport').onclick = ()=>document.getElementById('importFileInput').click();
        document.getElementById('importFileInput').onchange = e => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = ev => { try { const data=JSON.parse(ev.target.result); if (!data.rows) throw new Error('格式错误'); const elapsed=Math.floor((Date.now()-(data.exportTime||Date.now()))/1000); rows=data.rows.map(r=>({id:r.id,user:r.user||'',cropType:r.cropType||'16h',matureCountdown:Math.max(0,(r.matureCountdown||0)-elapsed),waterCountdown:Math.max(0,(r.waterCountdown||0)-elapsed),blessed:r.blessed!==undefined?r.blessed:true,dailyTaskDone:r.dailyTaskDone!==undefined?r.dailyTaskDone:false,consecutiveBless:r.consecutiveBless||'-',remark:r.remark||'',createOrder:r.createOrder||0,createdAt:r.createdAt||Date.now()})); nextId=data.nextId||1; nextCreateOrder=data.nextCreateOrder||1; lastBlessResetDate=data.lastBlessResetDate||''; sortState=SORT_DEFAULT; editingRowId=null; editSnapshot=null; tickBaseTime=Date.now(); checkAndResetDaily(); saveToStorage(); renderGroupedTable(); showToast(`导入成功 (${rows.length}条)`); } catch(ex) { showToast('导入失败: '+ex.message); } }; reader.readAsText(file); e.target.value=''; };

        configHeader.addEventListener('click', () => { configPanel.classList.toggle('collapsed'); });
        btnApplyConfig.addEventListener('click', () => { saveGroupConfig(); renderGroupedTable(); showToast('✅ 分组配置已应用'); });

        setInterval(() => { const now = Date.now(), elapsed = Math.floor((now - tickBaseTime) / 1000); if (elapsed <= 0) return; tickBaseTime += elapsed * 1000; let changed = false; rows.forEach(r => { if (editingRowId===r.id) return; if (r.matureCountdown>0){ r.matureCountdown=Math.max(0,r.matureCountdown-elapsed); changed=true; } if (r.waterCountdown>0){ r.waterCountdown=Math.max(0,r.waterCountdown-elapsed); changed=true; } }); if (changed) { updateDynamicDisplay(); saveToStorage(); } if (Math.floor(Date.now()/60000)!==Math.floor((Date.now()-1000)/60000)) updateWaterMatureRemainingColumn(); if (Math.floor(Date.now()/30000)!==Math.floor((Date.now()-1000)/30000)) checkAndResetDaily(); }, 1000);

        function updateWaterMatureRemainingColumn() { document.querySelectorAll('tbody tr[data-id]').forEach(tr=>{ const id=Number(tr.getAttribute('data-id')), row=rows.find(r=>r.id===id); if (!row||editingRowId===id) return; const mw=calcWaterMatureRemaining(row); const tdWait=tr.children[5]; if (tdWait) { const predictedHtml = mw.predicted ? ` <span class="predicted-time">${mw.predicted}</span>` : ''; const textHtml = mw.boldPart ? mw.text.replace(mw.boldPart, `<b>${mw.boldPart}</b>`) : mw.text; tdWait.innerHTML = `<span class="${mw.cls}">${textHtml}</span>${predictedHtml}`; } }); }
        function updateDynamicDisplay() { document.querySelectorAll('tbody tr[data-id]').forEach(tr=>{ const id=Number(tr.getAttribute('data-id')), row=rows.find(r=>r.id===id); if (!row||editingRowId===id) return; const c=CROP_CONFIG[row.cropType]; const matureCell = document.getElementById(`mature-cell-${id}`); if (matureCell && !matureCell.querySelector('input')) { const ts=matureCell.querySelector('.mature-time'); if (ts) ts.innerHTML = formatTime(row.matureCountdown)+(row.matureCountdown<=0?' <span class="mature-ripe-badge">熟</span>':''); const op=matureCell.querySelector('.mature-progress'); if (op) op.remove(); if (row.matureCountdown<=0){ const eb=document.createElement('div'); eb.className='mature-progress'; const s=document.createElement('div'); s.className='boss-hp-stack'; eb.appendChild(s); matureCell.appendChild(eb); } else matureCell.appendChild(renderBossHpBar(row.matureCountdown)); } const waterDiv = tr.querySelector('.water-vertical'); if (waterDiv) { const span = waterDiv.querySelector('span'); if (span) { const waterLow = row.waterCountdown > 0 && row.waterCountdown <= WATER_LOW_THRESHOLD; const waterIcon = waterLow ? ' <span class="water-low-icon" title="湿润时间不足2小时">💧</span>' : ''; const reduction = calcWaterReduction(row); const reductionText = formatReductionText(reduction); const reductionHtml = reductionText ? ` <span class="water-reduction-inline">(${reductionText})</span>` : ''; span.innerHTML = formatTime(row.waterCountdown)+(row.waterCountdown<=0?' <span class="dry-badge">干枯</span>':waterIcon)+reductionHtml; } const percent = c.waterMax ? Math.min(100,(row.waterCountdown/c.waterMax)*100) : 0; const fill = waterDiv.querySelector('.progress-bar-fill'); if (fill){ fill.style.width=percent+'%'; fill.className='progress-bar-fill '+(percent>50?'green':percent>=20?'orange':'red'); } } const waterBtn = tr.querySelector('.water-btn'); if (waterBtn){ const st=canWater(row); waterBtn.disabled=!st.can; const wr=waterBtn.closest('.tooltip-wrapper'); if (wr){ let tip=wr.querySelector('.tooltip-text'); if (!st.can){ if (!tip){ tip=document.createElement('span'); tip.className='tooltip-text'; wr.appendChild(tip); } tip.textContent=st.reason; } else if (tip) tip.remove(); } } tr.className = row.matureCountdown<=0?'row-success':(row.matureCountdown<=3600?'row-warning':''); }); }

        loadLogs(); cleanOldLogs(); loadGroupConfig();
        if (!loadFromStorage()) { rows=[]; nextId=1; nextCreateOrder=1; lastBlessResetDate=''; saveToStorage(); }
        checkAndResetDaily(); renderGroupedTable();
        window.addEventListener('beforeunload', saveToStorage);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible'){ const now=Date.now(), elapsed=Math.floor((now-tickBaseTime)/1000); if (elapsed>1){ rows.forEach(r=>{ if (editingRowId===r.id) return; r.matureCountdown=Math.max(0,r.matureCountdown-elapsed); r.waterCountdown=Math.max(0,r.waterCountdown-elapsed); }); tickBaseTime=now; saveToStorage(); renderGroupedTable(); checkAndResetDaily(); } } else { saveToStorage(); } });
    })();
</script>
</body>
</html>
