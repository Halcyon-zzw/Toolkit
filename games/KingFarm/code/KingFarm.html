<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作物倒计时管理系统</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --border: #e2e6ea;
            --text: #1a1d23;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --primary: #4f6ef7;
            --primary-hover: #3b54db;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning-light: #fef3c7;
            --danger-light: #fee2e2;
            --blessed-color: #f59e0b;
            --blessed-bg: #fffbeb;
            --unblessed-color: #9ca3af;
            --unblessed-bg: #f9fafb;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        .app-container { max-width: 1700px; margin:0 auto; padding:20px 24px 40px; }
        .app-header {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
            gap:12px; margin-bottom:24px; padding:20px 24px;
            background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
            border:1px solid var(--border);
        }
        .header-actions { display:flex; gap:8px; align-items:center; }
        .btn {
            display:inline-flex; align-items:center; gap:6px; padding:9px 16px;
            border-radius:var(--radius-sm); font-size:0.875rem; font-weight:500;
            cursor:pointer; border:1px solid transparent; transition:all var(--transition);
            white-space:nowrap; font-family:var(--font); outline:none;
            background:var(--surface); color:var(--text); border-color:var(--border);
        }
        .btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .btn-primary:hover { background:var(--primary-hover); }
        .btn-outline:hover { background:#f9fafb; }
        .btn-success { background:var(--success); color:#fff; border-color:var(--success); }
        .btn-success:hover { background:#059669; }
        .btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
        .btn-danger:hover { background:var(--danger-hover); }
        .btn-info { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }
        .btn-info:hover { background:#0284c7; border-color:#0284c7; }
        .btn-sm { padding:6px 11px; font-size:0.8rem; }
        .btn:disabled { opacity:0.45; cursor:not-allowed; }
        .tooltip-wrapper { position:relative; display:inline-flex; }
        .tooltip-text {
            visibility:hidden; opacity:0; position:absolute; bottom:calc(100% + 8px);
            left:50%; transform:translateX(-50%); background:#1e293b; color:#fff;
            padding:6px 12px; border-radius:6px; font-size:0.75rem; white-space:nowrap;
            pointer-events:none; transition:opacity 0.2s; z-index:100;
        }
        .tooltip-wrapper:hover .tooltip-text { visibility:visible; opacity:1; }
        .table-wrapper {
            background:var(--surface); border-radius:var(--radius);
            box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden;
        }
        .table-scroll { overflow-x:auto; max-height:75vh; overflow-y:auto; }
        table { width:100%; border-collapse:collapse; min-width:1700px; font-size:0.875rem; }
        thead th {
            background:#f8fafc; padding:13px 14px; text-align:left; font-weight:600;
            font-size:0.8rem; text-transform:uppercase; letter-spacing:0.04em;
            color:var(--text-secondary); border-bottom:2px solid #e5e7eb;
            white-space:nowrap; user-select:none;
        }
        thead th.sortable { cursor:pointer; position:relative; padding-right:28px; }
        thead th.sortable:hover { color:var(--primary); }
        .sort-icon { position:absolute; right:8px; font-size:0.7rem; opacity:0.5; }
        .sort-active .sort-icon { opacity:1; color:var(--primary); }
        .reset-sort {
            position:absolute; right:24px; font-size:0.65rem; cursor:pointer;
            opacity:0; transition:opacity 0.2s; color:var(--text-muted);
        }
        .sort-active .reset-sort { opacity:0.7; }
        .reset-sort:hover { opacity:1; color:var(--danger); }
        tbody td { padding:12px 14px; border-bottom:1px solid #f1f3f4; vertical-align:middle; }
        tbody tr.row-warning { background:var(--warning-light); }
        tbody tr.row-success { background:var(--success-light); }
        tbody tr.row-editing { background:#f0f4ff; box-shadow:inset 3px 0 0 var(--primary); }

        .mature-cell { display:flex; flex-direction:column; gap:4px; }
        .mature-time { font-weight:700; font-family:'SF Mono', 'Consolas', monospace; white-space:nowrap; }
        .mature-ripe-badge { display:inline-block; background:#ef4444; color:white; font-size:0.7rem; padding:2px 6px; border-radius:4px; margin-left:6px; font-weight:600; }
        .water-reduction-hint { display:block; font-size:0.7rem; color:#ef4444; animation: hintFadeIn 0.3s ease, hintFadeOut 0.6s ease 2.4s forwards; margin-top:2px; }
        @keyframes hintFadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; } }
        @keyframes hintFadeOut { to { opacity:0; } }

        .mature-progress { display:flex; align-items:center; gap:6px; }
        .boss-hp-stack { flex:1; min-width:80px; height:8px; background:#e5e7eb; border-radius:10px; overflow:hidden; position:relative; }
        .boss-hp-layer { position:absolute; left:0; top:0; bottom:0; transition:width 0.5s ease; }
        .layer-label { font-size:0.7rem; font-weight:600; color:var(--text-secondary); white-space:nowrap; min-width:20px; text-align:center; }

        .water-vertical { display:flex; flex-direction:column; gap:4px; min-width:120px; }
        .progress-bar-wrap { height:8px; background:#e5e7eb; border-radius:10px; overflow:hidden; }
        .progress-bar-fill { height:100%; border-radius:10px; transition:width 0.5s ease; }
        .progress-bar-fill.green { background:#10b981; }
        .progress-bar-fill.orange { background:#f59e0b; }
        .progress-bar-fill.red { background:#ef4444; }
        .dry-badge { display:inline-block; background:#fef2f2; color:#dc2626; font-size:0.68rem; padding:2px 7px; border-radius:10px; margin-left:4px; }
        .cross-day-badge { display:inline-block; background:#e0e7ff; color:#4338ca; font-size:0.68rem; padding:2px 7px; border-radius:10px; margin-left:4px; }

        .blessed-badge {
            display:inline-flex; align-items:center; gap:4px;
            padding:4px 10px; border-radius:20px; font-size:0.78rem;
            font-weight:600; cursor:pointer; transition:all var(--transition);
            user-select:none; white-space:nowrap;
        }
        .blessed-badge.has-bless { background: var(--blessed-bg); color: var(--blessed-color); border: 1.5px solid var(--blessed-color); }
        .blessed-badge.has-bless:hover { background: #fef3c7; transform: scale(1.03); }
        .blessed-badge.no-bless { background: var(--unblessed-bg); color: var(--unblessed-color); border: 1.5px solid #d1d5db; }
        .blessed-badge.no-bless:hover { background: #f3f4f6; }
        .bless-icon { font-size:0.9rem; }

        .task-badge {
            display:inline-flex; align-items:center; gap:4px;
            padding:5px 12px; border-radius:20px; font-size:0.78rem;
            font-weight:600; cursor:pointer; transition:all var(--transition);
            user-select:none; white-space:nowrap;
        }
        .task-badge.undone { background: #fef2f2; color: #dc2626; border: 2px solid #ef4444; }
        .task-badge.undone:hover { background: #fee2e2; transform: scale(1.04); }
        .task-badge.done { background: #065f46; color: #ffffff; border: 2px solid #047857; }
        .task-badge.done:hover { background: #047857; transform: scale(1.04); }
        .task-icon { font-size:0.9rem; }

        .edit-input { width:90px; padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; font-family:'SF Mono','Consolas',monospace; text-align:center; }
        .edit-input:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 3px rgba(79,110,247,0.1); }
        .edit-user-input { width:110px; padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; }
        .edit-select { padding:6px 8px; border:1.5px solid #d1d5db; border-radius:var(--radius-sm); font-size:0.85rem; background:white; cursor:pointer; }
        .toast-container { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
        .toast { background:#1e293b; color:#fff; padding:12px 18px; border-radius:var(--radius-sm); font-size:0.875rem; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toastSlideIn 0.35s ease; max-width:400px; }
        .toast-undo { background:#fff; color:#1e293b; border:none; padding:5px 12px; border-radius:4px; cursor:pointer; font-weight:600; font-size:0.8rem; }
        .toast-close { background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1rem; }
        @keyframes toastSlideIn { from { transform:translateX(60px); opacity:0; } to { transform:translateX(0); opacity:1; } }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:8000; display:flex; align-items:center; justify-content:center; }
        .modal { background:white; border-radius:var(--radius); padding:24px; box-shadow:var(--shadow-lg); max-width:400px; width:90%; }
        .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
        .immediate-mature { color:#10b981; font-weight:600; }
        .approx-mature { color:#f59e0b; }

        /* 日志弹窗样式 */
        .log-modal { max-width:700px; max-height:80vh; width:95%; }
        .log-table-wrap { max-height:50vh; overflow-y:auto; margin-top:12px; border:1px solid var(--border); border-radius:var(--radius-sm); }
        .log-table { width:100%; border-collapse:collapse; font-size:0.8rem; min-width:600px; }
        .log-table th { background:#f8fafc; padding:10px 12px; text-align:left; font-weight:600; font-size:0.75rem; color:var(--text-secondary); border-bottom:1px solid #e5e7eb; position:sticky; top:0; z-index:1; }
        .log-table td { padding:8px 12px; border-bottom:1px solid #f1f3f4; vertical-align:top; white-space:pre-wrap; font-size:0.78rem; max-width:200px; word-break:break-all; }
        .log-empty { text-align:center; padding:32px 16px; color:var(--text-muted); }
        @media (max-width:768px) { .app-container { padding:10px 8px; } table { min-width:1400px; } .log-modal { max-width:95vw; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1>🌾 作物倒计时管理系统</h1>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" id="btnExport">📥 导出</button>
            <button class="btn btn-outline btn-sm" id="btnImport">📤 导入</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none;">
            <button class="btn btn-primary" id="btnAddRow">＋ 添加行</button>
        </div>
    </div>
    <div class="table-wrapper">
        <div class="table-scroll" id="tableScroll">
            <table>
                <thead><tr>
                    <th>用户</th><th>作物类型</th>
                    <th class="sortable" id="thMature">成熟倒计时<span class="sort-icon">↕</span><span class="reset-sort" id="resetSort">↺</span></th>
                    <th>浇水湿润倒计时</th><th>水分干枯时间</th><th>浇水减少时间</th><th>浇水成熟剩余时间</th><th>祝福</th><th>每日任务</th><th>操作</th>
                </tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="emptyState" style="display:none; padding:48px; text-align:center; color:var(--text-muted);">📋<p>暂无数据</p></div>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<div id="modalContainer"></div>

<script>
    (function() {
        const CROP_CONFIG = {
            '16h': { matureTotal:57600, waterMax:19200, waterThreshold:18000, label:'16h作物' },
            '32h': { matureTotal:115200, waterMax:38400, waterThreshold:36000, label:'32h作物' }
        };
        const LAYER_COLORS = ['#3b82f6', '#f59e0b', '#ef4444', '#10b981', '#8b5cf6'];
        const STORAGE_KEY = 'crop-management-data';
        const LOG_STORAGE_KEY = 'crop-management-logs';
        const SORT_DEFAULT = 'default';
        const SORT_MATURE_ASC = 'matureAsc';
        const UNDO_TIMEOUT = 5000, WATER_HINT_DURATION = 3000;
        const BLESS_RESET_HOUR = 3;
        const LOG_RETENTION_DAYS = 3;

        let rows = [], nextId = 1, nextCreateOrder = 1, sortState = SORT_DEFAULT;
        let editingRowId = null, editSnapshot = null, lastSaveTime = Date.now(), undoData = {};
        let lastBlessResetDate = '';
        let tickBaseTime = Date.now();
        let logs = [], nextLogId = 1;

        const $ = s => document.querySelector(s);
        const tableBody = $('#tableBody'), emptyState = $('#emptyState');
        const toastContainer = $('#toastContainer'), modalContainer = $('#modalContainer');
        const thMature = $('#thMature'), resetSortBtn = $('#resetSort'), tableScroll = $('#tableScroll');

        function formatTime(s) {
            if (s<=0) return '00:00:00';
            const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }
        function formatTimeHM(s) { if(s<=0) return '0h 0m'; return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`; }
        function formatAbsoluteTime(secondsFromNow) {
            const d = new Date(Date.now() + Math.max(0,secondsFromNow)*1000);
            return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        function formatDateTime(ts) {
            const d = new Date(ts);
            const Y = d.getFullYear();
            const M = String(d.getMonth()+1).padStart(2,'0');
            const D = String(d.getDate()).padStart(2,'0');
            const H = String(d.getHours()).padStart(2,'0');
            const min = String(d.getMinutes()).padStart(2,'0');
            const S = String(d.getSeconds()).padStart(2,'0');
            return `${Y}-${M}-${D} ${H}:${min}:${S}`;
        }
        function isCrossingDay(s) {
            if(s<=0) return false;
            const now = new Date(), target = new Date(now.getTime()+s*1000);
            return now.getDate()!==target.getDate() || now.getMonth()!==target.getMonth() || now.getFullYear()!==target.getFullYear();
        }
        function calcWaterReduction(row) { const c=CROP_CONFIG[row.cropType]; return Math.floor((c.waterMax - row.waterCountdown)/4); }
        function calcWaterMatureRemaining(row) {
            if (row.matureCountdown <= 0) return { text: '-', cls: '' };
            const reduction = calcWaterReduction(row);
            if (reduction >= row.matureCountdown) return { text: '浇水立即成熟', cls: 'immediate-mature' };
            const remainingAfterWater = row.matureCountdown - reduction;
            const targetWater = Math.floor(remainingAfterWater / 5 * 4);
            if (row.waterCountdown > targetWater) {
                const waitMinutes = Math.ceil(targetWater / 60);
                if (waitMinutes >= 60) { const h = Math.floor(waitMinutes / 60); const m = waitMinutes % 60; return { text: `约${h}小时${m}分钟后成熟`, cls: 'approx-mature' }; }
                return { text: `约${waitMinutes}分钟后成熟`, cls: 'approx-mature' };
            }
            return { text: '-', cls: '' };
        }
        function canWater(row) {
            if(row.matureCountdown<=0) return {can:false,reason:'已成熟'};
            const c=CROP_CONFIG[row.cropType];
            if(row.waterCountdown >= c.waterThreshold) return {can:false,reason:`需低于${formatTimeHM(c.waterThreshold)}`};
            return {can:true,reason:''};
        }

        function getTodayResetTime() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate(), BLESS_RESET_HOUR, 0, 0, 0).getTime();
        }
        function getTodayDateStr() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        }

        // ============ 日志系统 ============
        function formatRowState(row) {
            const c = CROP_CONFIG[row.cropType];
            return `作物类型：${c.label}\n成熟倒计时：${formatTime(row.matureCountdown)}\n浇水湿润倒计时：${formatTime(row.waterCountdown)}`;
        }
        function formatBlessState(blessed) { return blessed ? '有祝福' : '无祝福'; }
        function formatTaskState(done) { return done ? '已完成' : '未完成'; }

        function addLog(rowId, type, before, after) {
            const log = {
                id: nextLogId++,
                rowId: rowId,
                type: type,
                time: formatDateTime(Date.now()),
                before: before,
                after: after
            };
            logs.push(log);
            saveLogs();
        }

        function saveLogs() {
            try {
                localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify({ nextLogId, logs }));
            } catch(e) { console.warn('日志存储失败', e); }
        }

        function loadLogs() {
            try {
                const raw = localStorage.getItem(LOG_STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                logs = data.logs || [];
                nextLogId = data.nextLogId || 1;
            } catch(e) { logs = []; nextLogId = 1; }
        }

        function cleanOldLogs() {
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - LOG_RETENTION_DAYS);
            cutoffDate.setHours(0, 0, 0, 0);
            const cutoffTime = cutoffDate.getTime();
            const before = logs.length;
            logs = logs.filter(log => {
                const logTime = new Date(log.time.replace(/-/g, '/')).getTime();
                return logTime >= cutoffTime;
            });
            if (logs.length < before) saveLogs();
        }

        function getRowLogs(rowId) {
            return logs.filter(log => log.rowId === rowId).sort((a, b) => {
                return new Date(b.time.replace(/-/g, '/')).getTime() - new Date(a.time.replace(/-/g, '/')).getTime();
            });
        }

        function deleteRowLogs(rowId) {
            logs = logs.filter(log => log.rowId !== rowId);
            saveLogs();
        }

        function showLogModal(rowId) {
            const row = rows.find(r => r.id === rowId);
            const rowLogs = getRowLogs(rowId);
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            let tableRows = '';
            if (rowLogs.length === 0) {
                tableRows = '<tr><td colspan="4" class="log-empty">暂无操作日志</td></tr>';
            } else {
                rowLogs.forEach(log => {
                    tableRows += `<tr>
                    <td>${escapeHtml(log.type)}</td>
                    <td style="white-space:nowrap;">${log.time}</td>
                    <td>${escapeHtml(log.before)}</td>
                    <td>${escapeHtml(log.after)}</td>
                </tr>`;
                });
            }
            overlay.innerHTML = `
            <div class="modal log-modal">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h3>📋 操作日志 - ${escapeHtml(row?.user || '未命名')}</h3>
                    <button class="toast-close" style="font-size:1.2rem;cursor:pointer;" id="logClose">✕</button>
                </div>
                <div class="log-table-wrap">
                    <table class="log-table">
                        <thead><tr><th style="width:12%;">操作类型</th><th style="width:20%;">操作时间</th><th style="width:34%;">操作前</th><th style="width:34%;">操作后</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            </div>`;
            modalContainer.appendChild(overlay);
            overlay.querySelector('#logClose').onclick = () => overlay.remove();
            overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
        }

        // ============ 数据持久化 ============
        function saveToStorage() {
            lastSaveTime = Date.now();
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                version:16, nextId, nextCreateOrder, lastSaveTime, lastBlessResetDate,
                rows: rows.map(r=>({id:r.id,user:r.user,cropType:r.cropType,matureCountdown:r.matureCountdown,waterCountdown:r.waterCountdown,blessed:r.blessed,dailyTaskDone:r.dailyTaskDone,createOrder:r.createOrder,createdAt:r.createdAt}))
            }));
        }
        function loadFromStorage() {
            const raw = localStorage.getItem(STORAGE_KEY); if(!raw) return false;
            try {
                const data = JSON.parse(raw); if(!data.rows) return false;
                nextId = data.nextId||1; nextCreateOrder = data.nextCreateOrder||1;
                lastBlessResetDate = data.lastBlessResetDate || '';
                const elapsed = Math.floor((Date.now() - (data.lastSaveTime||Date.now()))/1000);
                rows = data.rows.map(r=>({
                    id:r.id, user:r.user||'', cropType:r.cropType||'16h',
                    matureCountdown:Math.max(0,(r.matureCountdown||0)-elapsed),
                    waterCountdown:Math.max(0,(r.waterCountdown||0)-elapsed),
                    blessed: r.blessed !== undefined ? r.blessed : true,
                    dailyTaskDone: r.dailyTaskDone !== undefined ? r.dailyTaskDone : false,
                    createOrder:r.createOrder||0, createdAt:r.createdAt||Date.now()
                }));
                if(rows.length) {
                    nextId = Math.max(nextId, Math.max(...rows.map(r=>r.id))+1);
                    nextCreateOrder = Math.max(nextCreateOrder, Math.max(...rows.map(r=>r.createOrder))+1);
                }
                lastSaveTime = Date.now();
                tickBaseTime = Date.now();
                return true;
            } catch(e) { return false; }
        }

        function checkAndResetDaily() {
            const today = getTodayDateStr();
            const resetTime = getTodayResetTime();
            const now = Date.now();

            const container = document.createElement('div'); container.className = 'mature-progress';
            const stack = document.createElement('div'); stack.className = 'boss-hp-stack';
            for (let i = 0; i < currentLayers; i++) {
                const layerDiv = document.createElement('div'); layerDiv.className = 'boss-hp-layer';
                layerDiv.style.backgroundColor = LAYER_COLORS[i % LAYER_COLORS.length];
                layerDiv.style.width = (i < currentLayerIndex ? '100%' : (i === currentLayerIndex ? topLayerPercent + '%' : '0%'));
                stack.appendChild(layerDiv);
            }
            container.appendChild(stack);
            const label = document.createElement('span'); label.className = 'layer-label'; label.textContent = `x${currentLayers}`;

                    const ts = matureCell.querySelector('.mature-time'); if(ts) ts.innerHTML = formatTime(row.matureCountdown)+(row.matureCountdown<=0?' <span class="mature-ripe-badge">熟</span>':'');
                    const op = matureCell.querySelector('.mature-progress'); if(op) op.remove();
                    if (row.matureCountdown <= 0) { const eb = document.createElement('div'); eb.className='mature-progress'; const s = document.createElement('div'); s.className='boss-hp-stack'; eb.appendChild(s); matureCell.appendChild(eb); }
                    else { matureCell.appendChild(renderBossHpBar(row.matureCountdown)); }
                }
                const waterDiv = tr.querySelector('.water-vertical');
                if(waterDiv) {
                    const span = waterDiv.querySelector('span'); if(span) span.innerHTML = formatTime(row.waterCountdown)+(row.waterCountdown<=0?' <span class="dry-badge">干枯</span>':'');
                    const percent = c.waterMax ? Math.min(100,(row.waterCountdown/c.waterMax)*100) : 0;
                    const fill = waterDiv.querySelector('.progress-bar-fill'); if(fill) { fill.style.width=percent+'%'; fill.className='progress-bar-fill '+(percent>50?'green':percent>=20?'orange':'red'); }
                }
                const dryTd = tr.children[4]; if(dryTd) dryTd.innerHTML = `${formatAbsoluteTime(row.waterCountdown)}${isCrossingDay(row.waterCountdown)?' <span class="cross-day-badge">跨</span>':''}`;
                tr.children[5].textContent = formatTimeHM(calcWaterReduction(row));
                const waterBtn = tr.querySelector('.water-btn');
                if(waterBtn) { const status = canWater(row); waterBtn.disabled = !status.can; const wrapper = waterBtn.closest('.tooltip-wrapper'); if(wrapper) { let tip = wrapper.querySelector('.tooltip-text'); if(!status.can) { if(!tip){ tip=document.createElement('span'); tip.className='tooltip-text'; wrapper.appendChild(tip); } tip.textContent=status.reason; } else if(tip) tip.remove(); } }
                tr.className = row.matureCountdown<=0?'row-success':(row.matureCountdown<=3600?'row-warning':'');
            });
        }

        loadLogs();
        cleanOldLogs();
        if(!loadFromStorage()) { rows=[]; nextId=1; nextCreateOrder=1; lastBlessResetDate = ''; saveToStorage(); }
        checkAndResetDaily();
        renderTable();
        window.addEventListener('beforeunload', saveToStorage);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                const now = Date.now(); const elapsed = Math.floor((now - tickBaseTime) / 1000);
                if (elapsed > 1) { rows.forEach(r => { if (editingRowId === r.id) return; r.matureCountdown = Math.max(0, r.matureCountdown - elapsed); r.waterCountdown = Math.max(0, r.waterCountdown - elapsed); }); tickBaseTime = now; saveToStorage(); renderTable(); checkAndResetDaily(); }
            } else { saveToStorage(); }
        });
    })();
</script>
</body>
</html>
